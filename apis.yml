aid: ninetyio
name: Ninety.io
description: >-
  Ninety.io (Ninety) is a software platform for implementing the Entrepreneurial
  Operating System (EOS). It gives founders and leadership teams purpose-built
  tools for the Accountability Chart, the Vision/Traction Organizer (V/TO),
  quarterly Rocks, the weekly Scorecard, To-Dos, the Issues List, and EOS meeting
  rhythms such as the Level 10 meeting. Ninety exposes a REST Public API (v1) at
  api.public.ninety.io authenticated with per-user Personal Access Tokens, giving
  programmatic create/read/update/delete access to To-Dos, Issues, Rocks,
  Milestones, Scorecard measurables (KPIs, scores, notes), Teams, and Users.
